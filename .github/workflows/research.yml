name: Research tests
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-research.txt
      - run: python -m pytest -q
      - name: Execute notebooks
        run: |
          python -c "import glob, nbformat; from nbclient import NotebookClient; [NotebookClient(nbformat.read(p, as_version=4), timeout=180, kernel_name='python3').execute() for p in glob.glob('notebooks/*.ipynb')]"
